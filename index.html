const daySel = document.getElementById("day");
const waterSel = document.getElementById("water");
const body = document.getElementById("body");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

function days() {
  return Object.keys(DATA).sort();
}
function fmtDay(ds) {
  const p = ds.split("-");
  return p[0] + "年" + Number(p[1]) + "月" + Number(p[2]) + "日";
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function fillDays() {
  daySel.innerHTML = days().map(d => `<option value="${d}">${fmtDay(d)}</option>`).join("");
  if (days().length) daySel.value = days()[days().length - 1];
}
function fillWaters() {
  const rows = DATA[daySel.value] || [];
  const map = new Map();
  rows.forEach(r => map.set(r.name, (map.get(r.name) || 0) + 1));
  const names = Array.from(map.keys());
  waterSel.innerHTML = `<option value="">全部水域（${rows.length}条）</option>` +
    names.map(n => `<option value="${esc(n)}">${esc(n)}（${map.get(n)}）</option>`).join("");
}
function render() {
  const all = DATA[daySel.value] || [];
  const w = waterSel.value;
  const rows = w ? all.filter(r => r.name === w) : all;
  body.innerHTML = rows.map(r =>
    `<tr><td>${esc(r.name)}</td><td class="item">${esc(r.item)}</td><td>${esc(r.miss)}</td></tr>`
  ).join("");
  count.textContent = "当前 " + rows.length + " 条";
  empty.style.display = rows.length ? "none" : "block";
}
daySel.addEventListener("change", () => { fillWaters(); render(); });
waterSel.addEventListener("change", render);
fillDays();
fillWaters();
render();
</script>
